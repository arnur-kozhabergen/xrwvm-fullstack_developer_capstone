<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Best Cars dealership: domestic and imported cars, a friendly team, and straightforward service.">
  <title>{% block title %}Best Cars{% endblock %}</title>
  <link rel="stylesheet" href="/static/bootstrap.min.css"><link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header"><nav class="site-nav" aria-label="Main navigation">
    <a class="brand" href="/">BEST<span>CARS</span><small>DEALERSHIPS</small></a>
    <div class="nav-links">
      <a href="/"{% if request.path == '/' %} aria-current="page"{% endif %}>Home</a>
      <a href="{% url 'about' %}"{% if request.path == '/about/' %} aria-current="page"{% endif %}>About Us</a>
      <a href="{% url 'contact' %}"{% if request.path == '/contact/' %} aria-current="page"{% endif %}>Contact Us</a>
    </div>
  </nav></header>
  <main id="main" class="page-shell">{% block content %}{% endblock %}</main>
  <footer class="site-footer"><span>Best Cars</span><p>A demonstration dealership for the Full Stack Capstone project.</p><a href="{% url 'contact' %}">Get in touch</a></footer>
</body>
</html>
