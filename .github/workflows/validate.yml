name: Fullstack validation
on: [push, pull_request]
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test -- --watchAll=false
        env:
          CI: 'true'
      - run: npm run build
        env:
          CI: 'true'
  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install -r server/requirements.txt flake8
      - run: flake8 djangoapp djangoproj --config .flake8
        working-directory: server
      - run: python manage.py test djangoapp -v 2
        working-directory: server
      - run: npm ci --no-audit --no-fund
        working-directory: server/database
      - run: npx jshint *.js
        working-directory: server/database
      - run: node --test api.test.js
        working-directory: server/database
      - run: docker build -t fullstack-django-ci server
      - run: docker build -t fullstack-node-ci server/database
  sentiment:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/djangoapp/microservices
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest test_sentiment -v
      - run: docker build -t fullstack-sentiment-ci .
